function hemi(cols,W,H){const n=cols.length,rows=Math.max(2,Math.min(8,Math.round(Math.sqrt(n/1.6))));const rad=[];let sum=0;for(let r=0;r<rows;r++){const rr=H*0.42+(H*0.5)*(r/(rows-1));rad.push(rr);sum+=rr}const cnt=rad.map(x=>Math.max(1,Math.round(n*x/sum)));cnt[rows-1]+=n-cnt.reduce((a,b)=>a+b,0);const pts=[];rad.forEach((rr,i)=>{for(let j=0;j<cnt[i];j++){const a=Math.PI*(cnt[i]==1?0.5:j/(cnt[i]-1));pts.push([a,rr])}});pts.sort((a,b)=>b[0]-a[0]);const dot=Math.max(3,Math.min(14,H*0.55/rows/2.1));return pts.map((p,i)=>`<circle cx="${(W/2+Math.cos(p[0])*p[1]).toFixed(1)}" cy="${(H-6-Math.sin(p[0])*p[1]).toFixed(1)}" r="${dot.toFixed(1)}" fill="${cols[i]}"/>`).join('')}

function act(k,v){
if(k=='go'){S.scr=+v;if(S.scr>3)S.scr=3}
else if(k=='skin')ME.skin=SK[v];else if(k=='hair')ME.hair=HC[v];else if(k=='shirt')ME.shirt=SH[v];else if(k=='hs')ME.hs=+v;else if(k=='e')ME.e=+v;else if(k=='g')ME.g=!ME.g;
else if(k=='rand'){ME.skin=SK[Math.floor(Math.random()*8)];ME.hair=HC[Math.floor(Math.random()*6)];ME.hs=Math.floor(Math.random()*5);ME.shirt=SH[Math.floor(Math.random()*5)];ME.g=Math.random()<.3}
else if(k=='key'){if(S.fim){S.fim=0;S.urna=''}if(S.urna.length<5)S.urna+=v}
else if(k=='corrige'){S.urna='';S.fim=0}else if(k=='branco'){S.urna='';S.fim=1}else if(k=='confirma'){if(S.urna.length==5)S.fim=1}
else if(k=='apu'){S.apu=S.apu>=100?58:Math.min(100,+(S.apu+8.4).toFixed(1))}
render()}
st.onclick=e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a.split(':');act(a[0],a[1])};
addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='4'&&S.scr!=2){S.scr=+e.key-1;render();return}
if(S.scr==2){if(/^[0-9]$/.test(e.key))act('key',e.key);else if(e.key=='Enter')act('confirma');else if(e.key=='Backspace')act('corrige')}});
